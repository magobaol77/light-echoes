async function aiTurn(){if(S.mode!=='ai'||S.p!==1||S.setup||S.openingSetup||S.winner!==null)return;log('The automa takes its turn.');await startTurn();while(S.phase==='action'&&S.winner===null){let hand=S.players[1].hand,playable=hand.filter(id=>canPlay(id)).sort((a,b)=>{let x=CARDS[b],y=CARDS[a];return (Number(x.attack)||0)+(x.life||0)+x.stars-(Number(y.attack)||0)-(y.life||0)-y.stars});if(playable.length)await playCard(playable[0]);else if(waiting(1).length)await accelerate([waiting(1).slice().sort((a,b)=>position(b)-position(a))[0].uid]);else{log('The automa has no legal main action and passes.');spend()}}if(S.phase==='activate'&&S.winner===null){if(eligibleCastle(1)&&S.players[1].hand.length)await castleAbility(1);for(const c of own(1).slice()){if(S.winner!==null)break;if(!eligible(c))continue;if(c.tapped){await activate(c,'untap');continue}if(special(c)){let ok=await ability(c);if(ok){if(c.bonus)c.bonus--;else c.used=true;continue}}if(eligible(c)&&creature(c))await activate(c,'attack');else if(eligible(c)&&building(c))await activate(c,'untap')}await endTurn()}}

function showRules(){modal('<h2>How to play · 1.3</h2><p>Choose VS Player or VS Automa when starting a new game. Before turn 1, each player draws 6 cards, plays 1 card face down onto their timer, and discards 2. Jade takes the first turn. Both castles have 10 life. All draws come from the facedown deck. There is no shared display or initial play-and-discard setup.</p><ol><li><b>Start your turn.</b> Slide your timer once. The six timer tiles always have 3 Fast, 2 Medium and 1 Slow symbols, with no identical symbols next to each other. At each turn, time 1 exits, the outside tile enters at time 5, and cards on the exiting tile enter play. Spells resolve immediately.</li><li><b>Choose one main action.</b> Play 1 card from your hand onto the timer at its cost, or spend 2 timer moves: advance one card by 2 spaces or two cards by 1 space each.</li><li><b>Activate.</b> Each card matching your outside symbol may activate once. Creatures attack or use their ability. There are no zones and no creature movement. Timer cards stay face down until they enter play, except green cards played while Tree of life is active. When a creature attacks, the castle is the default target. The defender then chooses exactly one creature or building to take the full hit, or lets the castle take it. Excess damage is lost. In VS Player, the defending player makes this choice. In VS Automa, the automa blocks with the lowest-cost creature or building that survives the whole hit; if none survives, it lets the castle take the damage. The castle has a Fast ability: discard 1 card to draw 1.</li><li><b>End your turn.</b> Discard any cards you want, then draw until you have 3 cards. In VS Automa, the automa discards its lowest-value cards only as needed to reach 3, then refills.</li><li><b>Win.</b> Destroy the enemy castle, or have cards of all five colors in play (Red, Green, Blue, White, and Black). Manticore counts as all five; Colorless cards do not count. Cristal temple wins with four cards of one color.</li></ol><h3>Timer capacity</h3><p>Each tile holds at most 2 cards. A card placed at a full position goes to the first free higher-numbered tile, up to 5. If none is free, you cannot play it. An advance blocked by capacity may be shortened or leave the card in place. For two-card advances, the card nearest the exit moves first.</p><h3>Card rulings for this playtest</h3><p>The 81 cards come from the Blue, Green, White, Red, Black, and Multi sheets. Cards ideas and Stars track are excluded. Destruction is not damage. Tapped cards do not provide passive effects; their next activation only untaps them. A tapped permanent building may untap in its owner’s activation phase. The automa chooses the cheapest defender able to survive an attack; if no defender can survive it, it chooses its castle.</p><p>Spells and destroyed cards go to the owner’s graveyard. Cards discarded from hands go to the shared discard, reshuffled when the deck runs out. Older saved matches are migrated to card set 1.1; new cards are added to the deck and retired cards removed. Undo restores an entire action, including its choices.</p>')}
render();save();if(S.mode==='ai'&&S.p===1&&!S.setup&&!S.menu&&S.winner===null)setTimeout(()=>run(aiTurn),250);document.querySelector('.local').textContent=S.mode==='ai'?'You vs Automa':'2 players · same screen';


</script></body></html>
