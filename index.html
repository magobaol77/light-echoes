case 'regeneration':await heal(p,3);break;
case 'rebuilt':await heal(p,3,'buildings');break;
case 'peace pact':for(let pl of S.players)S.discard.push(...pl.hand.splice(0));break;
case 'révolution':for(let x of [...units(p)].filter(x=>!def(x).stars)){if(S.winner!==null)break;await attack(x)}break;
case 'fireball':{let max=S.players[p].hand.length;let n=await pick('Fireball: how many cards to discard?',Array.from({length:max+1},(_,i)=>i),String);if(n){t=await pick('Fireball: choose an enemy creature or building',targets(p).filter(x=>!x.tower));if(t&&await pay(p,n))damage(t,n)}break;}
case 'embush':col=await pick('Choose a color',COLORS,x=>x);if(col)for(let x of [...S.board].filter(x=>creature(x)&&color(x,col)))damage(x,2);break;
case 'final assault':grant(units(p).filter(x=>color(x,'Red')));break;
}}
const SPECIAL=['Apprentice','Necromancer','Manipulator','Life sculptor','Oracle','Mage','Spell Master','Wise senator','Bell of the Damned','Magnetic Force','Elf summoner','Lumberjack','Druid','Elf scout','Wise owl','Source of growth','Secret passages','Sentinel','Mason','Clerc','Angel','Priest','Wise peacekeeper','Hospital','Astrology center','Saboteur','Wise boar','Clone'];
const special=c=>SPECIAL.some(n=>named(c,n));
async function freeActivation(c,depth=0){if(depth>8||S.winner!==null||!S.board.includes(c))return false;if(c.tapped){c.tapped=false;log(def(c).name+' untaps.');return true}let modes=[];if(creature(c)&&attackTargets(c).length)modes.push('attack');if(special(c)&&!named(c,'Clone')&&!named(c,'Apprentice')&&!named(c,'Angel'))modes.push('ability');let m=await pick('Extra activation: '+def(c).name,modes,x=>x==='attack'?'Attack':'Use ability',true);if(m==='attack')return attack(c);if(m==='ability')return ability(c,depth+1);return false}
async function ability(c,depth=0){const p=c.owner,n=def(c).name.toLowerCase();let t,id,list,num;
switch(n){
case 'apprentice':t=await pick('Activate another friendly blue creature',units(p).filter(x=>x.uid!==c.uid&&color(x,'Blue')),targetLabel,true);if(t)await freeActivation(t,depth+1);else return false;break;
case 'necromancer':if(timerSlot(p,2)===null)return false;t=await pick('Return a creature from your graveyard to time 2',S.grave[p].filter(creature));if(!t)return false;S.grave[p]=S.grave[p].filter(x=>x.uid!==t.uid);place(instance(t.id,p),2);break;
case 'manipulator':t=await pick('Tap an enemy creature',units(1-p).filter(x=>!x.tapped));if(!t)return false;t.tapped=true;break;
case 'life sculptor':t=await pick('Move 1 damage: choose the source',S.board.filter(x=>x.damage>0));if(!t)return false;{let to=await pick('Move 1 damage: choose a different card',S.board.filter(x=>x.uid!==t.uid&&!protectedDamage(x)));if(!to)return false;t.damage--;damage(to,1)}break;
case 'oracle':if(timerSlot(p,3)===null)return false;S.board=S.board.filter(x=>x.uid!==c.uid);place(c,3);draw(p,2);break;
case 'mage':await timerMoves(p,1);break;
case 'spell master':list=S.grave[p].filter(x=>def(x).type==='Sorcery');if(!list.length||!S.players[p].hand.length)return false;t=await pick('Return a spell to your hand',list,x=>def(x).name);if(!t||!await pay(p,1))return false;S.grave[p]=S.grave[p].filter(x=>x.uid!==t.uid);S.players[p].hand.push(t.id);break;
case 'wise senator':list=waiting(p).filter(x=>position(x)<=3&&timerSlot(p,position(x)+2,x.uid)!==null);t=await pick('Move a card back 2 spaces to gain 1 star',list,x=>def(x).name+' · time '+position(x));if(!t)return false;await moveTimer(t,-2);gainStars(p,1);break;
case 'bell of the damned':num=await pick('Discard X cards for X timer moves',Array.from({length:S.players[p].hand.length+1},(_,i)=>i),String);if(!num)return false;if(await pay(p,num))await timerMoves(p,num);break;
case 'magnetic force':t=await pick('Tap an enemy building',own(1-p).filter(x=>building(x)&&!x.tapped));if(!t)return false;t.tapped=true;break;
case 'elf summoner':if(timerSlot(p,5)===null)return false;id=await pick('Play a green creature from hand at time 5',S.players[p].hand.filter(id=>creature({id})&&color({id},'Green')),id=>CARDS[id].name);if(id===null)return false;S.players[p].hand.splice(S.players[p].hand.indexOf(id),1);place(instance(id,p),5);break;
case 'lumberjack':await heal(p,1,'buildings');break;
case 'druid':extraAction();break;
case 'elf scout':list=S.deck.filter(id=>creature({id})&&color({id},'Green'));if(!list.length||!S.players[p].hand.length)return false;if(!await pay(p,1))return false;id=await pick('Search the deck for a green creature',list,id=>CARDS[id].name);S.deck.splice(S.deck.indexOf(id),1);S.players[p].hand.push(id);shuffle(S.deck);break;
case 'wise owl':if(!await pay(p,2))return false;gainStars(p,1);break;
case 'source of growth':if(!await pay(p,1))return false;extraAction();break;
case 'secret passages':await timerMoves(p,2);break;
case 'sentinel':if(!S.deck.length)return false;id=S.deck[S.deck.length-1];num=await pick('Top card: '+CARDS[id].name+'. Remove it from the game?',[true,false],x=>x?'Remove':'Keep on top');if(num)S.removed.push(S.deck.pop());break;
case 'mason':t=await pick('Advance a friendly building by 1',waiting(p).filter(building),x=>def(x).name);if(!t)return false;await moveTimer(t,1);break;
case 'clerc':t=await pick('Sacrifice Clerc to destroy another creature',S.board.filter(x=>creature(x)&&x.uid!==c.uid));if(!t)return false;kill(c);kill(t);break;
case 'angel':if(!S.players[p].hand.length)return false;t=await pick('Activate a friendly creature',units(p),targetLabel,true);if(!t||!await pay(p,1))return false;await freeActivation(t,depth+1);break;
case 'priest':list=S.grave[p].filter(x=>creature(x)&&color(x,'White'));S.players[p].hand.push(...list.map(x=>x.id));S.grave[p]=S.grave[p].filter(x=>!list.includes(x));break;
case 'wise peacekeeper':if(S.attacked[p]){log('A friendly creature has already attacked this turn.');return false}S.peace.push({p,uid:c.uid});log('Peacekeeper: gain 1 star at turn end if none of your creatures attack.');break;
case 'hospital':for(let x of units(p))x.damage=0;break;
case 'astrology center':if(!await pay(p,2))return false;extraAction();break;
case 'saboteur':t=await pick('Sacrifice Saboteur to destroy a building',S.board.filter(building));if(!t)return false;kill(c);kill(t);break;
case 'wise boar':if(units(p).reduce((s,x)=>s+def(x).life-x.damage,0)<2)return false;for(let i=0;i<2;i++){t=await pick('Deal 1 damage to a friendly creature · '+(2-i)+' left',units(p));if(!t)return false;damage(t,1)}gainStars(p,1);break;
case 'clone':t=await pick('Copy a Medium enemy creature activation',units(1-p).filter(x=>speed(x)==='Medium'&&!named(x,'Clone')),targetLabel,true);if(!t)return false;{let original=c.id;c.id=t.id;try{await freeActivation(c,depth+1)}finally{c.id=original}if(S.board.includes(c)&&c.damage>=def(c).life)kill(c)}break;
default:return false;
}log(def(c).name+' uses its ability.');victory();return true}
async function activate(c,mode,firstTarget=null){if(!eligible(c)||S.winner!==null)return;let usedBonus=c.bonus>0;if(c.tapped){c.tapped=false;log(def(c).name+' untaps instead of activating.')}else{let ok=mode==='attack'&&creature(c)?await attack(c,firstTarget):mode==='ability'&&special(c)?await ability(c):false;if(!ok)return}if(usedBonus)c.bonus--;else c.used=true;victory()}
function endTurn(){if(S.phase!=='activate'||S.winner!==null)return;for(let e of S.peace)if(e.p===S.p&&!S.attacked[e.p])gainStars(e.p,1);S.peace=[];if(S.winner!==null)return;S.p=1-S.p;S.turn++;S.phase='start';S.actions=1;S.attacked=[false,false];for(let c of S.board){c.used=false;c.bonus=0}log('Turn '+S.turn+': '+NAMES[S.p]+'.')}

</script><script>
let selected=null,accelerated=[],busy=false,history=[],attackSource=null;

function description(d){return TEXT[d.name]||(d.type==='Creature'?'Attack an enemy creature, building, or castle.':d.ability)}
const SAVE='light-echoes-v2';
function save(){try{localStorage.setItem(SAVE,JSON.stringify({S,sequence}))}catch{}}
try{let x=JSON.parse(localStorage.getItem(SAVE));if(x?.S?.version===2){S=x.S;sequence=x.sequence;migrateDisplay()}else fresh()}catch{fresh()}
function find(uid){return [...S.board,...waiting(0),...waiting(1)].find(c=>c.uid===uid)}
async function run(fn){if(busy||S.winner!==null)return;history.push(JSON.stringify({S,sequence}));if(history.length>40)history.shift();busy=true;render();try{await fn()}catch(e){console.error(e);let x=JSON.parse(history.pop());S=x.S;sequence=x.sequence;migrateDisplay();log('The action was rolled back. Please try again.')}busy=false;selected=null;accelerated=[];attackSource=null;save();render()}
function choose(title,items,label,optional=false){return new Promise(resolve=>{render();const m=$('#modal');$('#modalBody').innerHTML='<h2>'+esc(title)+'</h2><div class="choices">'+items.map((x,i)=>'<button data-choice="'+i+'">'+esc(label(x))+'</button>').join('')+(optional?'<button data-choice="skip">Skip</button>':'')+'</div>';m.querySelector('.close').hidden=true;m.oncancel=e=>e.preventDefault();m.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{m.close();m.oncancel=null;m.querySelector('.close').hidden=false;resolve(b.dataset.choice==='skip'?null:items[Number(b.dataset.choice)])});m.showModal()})}
function modal(html){if(busy)return;$('#modalBody').innerHTML=html;$('#modal').querySelector('.close').hidden=false;$('#modal').showModal()}
async function newGame(){if(busy)return;let yes=await choose('Start a new game?',[false,true],x=>x?'Start a new game':'Keep playing');if(yes){fresh();history=[];selected=null;accelerated=[];save();render()}}
function undo(){if(busy||!history.length)return;let x=JSON.parse(history.pop());S=x.S;sequence=x.sequence;migrateDisplay();selected=null;accelerated=[];save();render()}
function selectCard(id,kind){if(busy)return;selected={id,kind};render()}
async function handClick(id){const i=pickIndex(id);if(i>=0){resolvePick(i);return}if(busy)return;if(S.phase==='action'&&canPlay(id)){const slot=timerSlot(S.p,cost(id,S.p)),yes=await choose('Play '+CARDS[id].name+' onto time '+slot+'?',[true,false],x=>x?'Play card':'Cancel');if(yes&&S.phase==='action'&&canPlay(id))await run(()=>playCard(id));return}selectCard(id,'hand')}
function selectUnit(uid){if(busy)return;selected={uid};render()}
function toggleTime(uid){if(busy)return;let c=find(uid);selected={uid};if(S.phase==='action'&&c.owner===S.p){if(accelerated.includes(uid))accelerated=accelerated.filter(x=>x!==uid);else if(accelerated.length<2)accelerated.push(uid)}render()}
function cardHTML(id,kind='hand'){const d=CARDS[id];return '<button class="card '+(pendingHandChoice()&&pendingPick.items.includes(id)?'pending-choice ':'')+(selected?.id===id&&selected?.kind===kind?'selected':'')+'" style="--cardColor:'+palette[d.color]+'" onclick="'+(kind==='catalog'?'detail('+id+')':kind==='hand'?'clickHand('+id+')':'selectCard('+id+',\''+kind+'\')')+'"><div class="cardtop"><span>'+esc(d.color)+'</span><b>◷ '+cost(id,S.p)+'</b></div><h3>'+esc(d.name)+'</h3><span class="kind">'+(d.type==='Sorcery'?'Spell':d.type)+' · '+speed({id})+'</span><p>'+esc(description(d))+'</p><div class="stats"><span>'+(d.type==='Creature'?'⚔ '+d.attack+'　':'')+(d.life?'♥ '+d.life:'Instant')+'</span><span>★ '+d.stars+'</span></div></button>'}
function track(p){const pl=S.players[p];return '<div class="player '+(p?'enemy':'')+'"><strong>'+NAMES[p]+' <span class="badge">'+(p===S.p?'playing':'waiting')+'</span></strong><div class="scores"><span>♥ '+pl.hp+'/10</span><span>'+pl.hand.length+' in hand</span><span>'+waiting(p).length+' on timer</span></div></div><div class="track">'+pl.timer.map((t,i)=>'<div class="tile"><div class="tilehead"><span>'+(i+1)+(i===0?' · exit':'')+'</span><span class="symbol">'+SIGNS[t.sign]+' <small>'+t.sign+'</small></span></div><span class="tile-capacity">'+t.cards.length+'/2</span>'+t.cards.map(c=>'<button class="mini '+(accelerated.includes(c.uid)?'selected ':'')+(pendingPick&&pickIndex(c)>=0?'pending-choice':'')+'" style="--cardColor:'+palette[def(c).color]+'" onclick="clickTimer('+c.uid+')">'+esc(def(c).name)+'</button>').join('')+'</div>').join('')+'<div class="tile out"><div class="tilehead">OUTSIDE<span class="symbol">'+SIGNS[pl.outside]+' '+pl.outside+'</span></div><small>ACTIVE SYMBOL</small></div></div>'}
function unitHTML(c){const target=attackSource!==null&&attackTargets(find(attackSource)||{}).some(x=>x.uid===c.uid)||pendingPick&&pendingPick.items.some(x=>x?.uid===c.uid);return '<button class="unit '+(eligible(c)?'ready':'')+(c.tapped?' tapped':'')+(target?' target-choice':'')+'" style="--cardColor:'+palette[def(c).color]+'" onclick="clickUnit('+c.uid+')"><strong>'+esc(def(c).name)+'</strong><span class="meta">'+SIGNS[speed(c)]+' '+speed(c)+(c.tapped?' · TAPPED':c.used&&!c.bonus?' · used':'')+'</span><span class="stats"><span>'+(creature(c)?'⚔ '+attackValue(c,{tower:false,id:c.id,owner:c.owner})+'　':'')+'♥ '+(def(c).life-c.damage)+'/'+def(c).life+'</span><span>★ '+def(c).stars+'</span></span></button>'}
function castles(p){const target=attackSource!==null&&attackTargets(find(attackSource)||{}).some(x=>x.tower&&x.owner===p)||pendingPick&&pendingPick.items.some(x=>x?.tower&&x.owner===p);return '<button class="castle-card castle-'+p+(target?' target-choice':'')+'" onclick="clickCastle('+p+')" aria-label="'+NAMES[p]+' castle, '+S.players[p].hp+' of 10 life"><span class="eyebrow">'+NAMES[p]+' · '+(p===S.p?'YOUR CASTLE':'ENEMY CASTLE')+'</span><strong>Castle</strong><span class="castle-hp">♥ '+S.players[p].hp+'<small> / 10</small></span><span class="castle-meter"><span style="width:'+(S.players[p].hp*10)+'%"></span></span><span>'+(has(p,'Protection Wall')?'Protected by Protection Wall':'Click an attacking creature, then click this castle')+'</span></button>'}
function castleInfo(p){modal('<h2>'+NAMES[p]+' castle</h2><p>Life: <b>'+S.players[p].hp+'/10</b></p><p>'+(p===S.p?'This is your castle.':'To attack this castle, select an available creature on your field, press Attack, then choose '+NAMES[p]+' castle.')+'</p>'+(has(p,'Protection Wall')?'<p>Protection Wall currently prevents damage to this castle.</p>':''))}

function starTrack(){return '<section class="star-panel"><div class="sectionhead"><h2>Stars · tug of war</h2><span>Reach your end to win</span></div><div class="star-labels"><b>← Jade</b><b>Amber →</b></div><div class="star-track">'+Array.from({length:11},(_,i)=>i-5).map(n=>'<div class="star-cell '+(n===S.star?'current':'')+'" aria-label="'+(n===0?'Center':(n<0?'Jade ':'Amber ')+Math.abs(n))+(n===S.star?', marker here':'')+'"><strong>'+(n===S.star?'★':Math.abs(n)===5?'WIN':Math.abs(n))+'</strong><small>'+([-3,4].includes(n)?'DRAW 1':[-1,2].includes(n)?'HIT 1':'')+'</small></div>').join('')+'</div><p class="track-note">Bonuses apply at the start of your turn when the marker is on that exact space on your side.</p></section>'}
function render(){const phase={start:['START OF TURN','Resolve your track bonus, then slide your timer once.'],resolving:['RESOLVING','Finish the effect to continue.'],action:['MAIN ACTION','Advance 2, draw 2 and discard 1, or play 1 card from your hand.'],activate:['ACTIVATION','Use cards matching your outside symbol, in any order.']},info=phase[S.phase]||phase.start;
$('#app').innerHTML=(S.winner!==null?'<div class="win"><h2>'+NAMES[S.winner]+' wins!</h2><p>'+(S.winReason==='stars'?'The star marker reached the end.':'The enemy castle has fallen.')+'</p><button onclick="newGame()">Play again</button></div>':'')+'<div class="turnbar"><div><span class="phase">TURN '+S.turn+' · '+info[0]+'</span><h2>Your move, '+NAMES[S.p]+'.</h2><p>'+info[1]+'</p></div>'+(S.phase==='start'?'<button class="primary" onclick="run(startTurn)">Start turn · slide 1 →</button>':S.phase==='activate'?'<button class="primary" onclick="run(async()=>endTurn())">End turn →</button>':'<span class="badge">'+S.actions+' action(s)</span>')+'</div>'+starTrack()+'<div class="layout"><section class="table">'+track(1)+field(1)+field(0)+track(0)+'<div class="sectionhead"><h2>'+NAMES[S.p]+'’s hand</h2><span>'+S.players[S.p].hand.length+' cards</span></div><div class="hand">'+(S.players[S.p].hand.map(id=>cardHTML(id)).join('')||'<p class="muted">Your hand is empty. Use Draw 2 to draw from the deck.</p>')+'</div><div class="legend"><span>ϟ Fast · 3 tiles</span><span>◈ Medium · 2 tiles</span><span>◷ Slow · 1 tile</span></div></section><aside><span class="eyebrow">YOUR MOVE</span>'+side()+'<div class="log"><span class="eyebrow">GAME LOG</span>'+S.log.slice(0,7).map(l=>'<p>'+esc(l)+'</p>').join('')+'</div><div class="actions"><button onclick="undo()" '+(!history.length?'disabled':'')+'>↶ Undo last action</button><button onclick="graveyard()">Graveyards & discard</button></div><div class="footer">Saved in this browser · version 1.0</div></aside></div>';
if(busy||S.winner!==null)$('#app').querySelectorAll('button').forEach(b=>{const a=b.getAttribute('onclick')||'',canPick=busy&&pendingPick&&(a.includes('clickUnit(')||a.includes('clickCastle(')||a.includes('clickHand(')||a.includes('clickTimer(')||a.includes('resolvePick('));if(!canPick&&!a.includes('newGame')&&!a.includes('undo'))b.disabled=true});document.querySelectorAll('header button').forEach(b=>b.disabled=busy)}
function pendingHandChoice(){return !!(pendingPick&&(pendingPick.title.startsWith('Discard ')||pendingPick.title.toLowerCase().includes('from hand')))}
function pickIndex(item){if(!pendingPick)return -1;return pendingPick.items.findIndex(x=>item?.tower?x?.tower&&x.owner===item.owner:item?.uid?x?.uid===item.uid:typeof item==='number'?pendingHandChoice()&&x===item:x===item)}

function clickTimer(uid){const c=find(uid),i=pickIndex(c);if(i>=0){resolvePick(i);return}if(busy)return;toggleTime(uid)}
function clickUnit(uid){const c=find(uid);if(!c)return;const i=pickIndex(c);if(i>=0){resolvePick(i);return}if(busy)return;if(attackSource!==null){const a=find(attackSource),t=a&&attackTargets(a).find(x=>x.uid===uid);if(t){run(()=>activate(a,'attack',t));return}}if(S.phase==='activate'&&c.owner===S.p&&eligible(c)&&creature(c)){attackSource=uid;selected={uid};render();return}if(S.phase==='activate'&&c.owner===S.p&&eligible(c)&&c.tapped){run(()=>activate(c,'untap'));return}selected={uid};render()}
function clickCastle(p){const tower={tower:true,owner:p},i=pickIndex(tower);if(i>=0){resolvePick(i);return}if(busy)return;if(attackSource!==null){const a=find(attackSource),t=a&&attackTargets(a).find(x=>x.tower&&x.owner===p);if(t){run(()=>activate(a,'attack',t));return}}castleInfo(p)}
function pickVisible(x){return !!(x?.tower||x?.uid&&(S.board.some(c=>c.uid===x.uid)||position(x))||typeof x==='number'&&pendingHandChoice()&&S.players[S.p].hand.includes(x))}
function side(){let h='';if(pendingPick){const vis=pendingPick.items.map((x,i)=>({x,i})).filter(v=>pickVisible(v.x));const other=pendingPick.items.map((x,i)=>({x,i})).filter(v=>!pickVisible(v.x));h='<div class="selectedDetail pending"><h2>'+esc(pendingPick.title)+'</h2><p>'+(vis.length?'Click a highlighted card or castle.':'Choose an option below.')+'</p>'+(other.length?'<div class="choices">'+other.map(v=>'<button onclick="resolvePick('+v.i+')">'+esc(pendingPick.label(v.x))+'</button>').join('')+'</div>':'')+(pendingPick.optional?'<button onclick="resolvePick(\'skip\')">Skip</button>':'')+'</div>';return h}if(S.phase==='start')h='<h2>The next beat</h2><p>The star-track bonus resolves first, then your timer slides one step. Cards at time 1 enter play and gain their printed stars.</p>';if(S.phase==='action')h='<h2>Choose an action</h2><p>Deck: '+S.deck.length+' cards · discard: '+S.discard.length+'</p><div class="actions"><button class="primary" onclick="run(drawAction)" '+(!(S.deck.length+S.discard.length)?'disabled':'')+'>Draw 2'+(has(S.p,'Monolith')?' · keep both':' · discard 1')+'</button><button onclick="run(()=>accelerate(accelerated))" '+(!accelerated.length?'disabled':'')+'>Advance '+(accelerated.length===2?'2 cards × 1 space':'1 card × 2 spaces')+'</button></div><p>Click a hand card to play it. Select timer cards, then advance them.</p>'+(!(S.deck.length+S.discard.length)&&!waiting(S.p).length&&!S.players[S.p].hand.some(id=>canPlay(id))?'<button onclick="run(async()=>spend())">No legal action · pass</button>':'');if(S.phase==='activate')h='<h2>Activate your cards</h2><p>Active symbol: <b>'+SIGNS[S.players[S.p].outside]+' '+S.players[S.p].outside+'</b>. Click a ready creature, then an enemy card or castle to attack.</p>';if(attackSource!==null){const c=find(attackSource);if(c&&special(c))h+='<p>'+esc(def(c).name)+' selected. Click an enemy card or castle, or use its ability.</p><button onclick="run(()=>activate(find('+c.uid+'),\'ability\'))">Use ability</button>'}if(selected?.id!==undefined){let id=selected.id,slot=timerSlot(S.p,cost(id,S.p));h+='<div class="selectedDetail"><h3>'+esc(CARDS[id].name)+'</h3><p>'+esc(description(CARDS[id]))+'</p>'+(selected.kind==='hand'?'<p>'+(slot===null?'No free slot at or above its cost.':'Enters at time <b>'+slot+'</b> · printed cost '+CARDS[id].cost)+'</p>':'')+'</div>'}if(selected?.uid){let c=find(selected.uid);if(c&&!attackSource){h+='<div class="selectedDetail"><h3>'+esc(def(c).name)+'</h3><p>'+esc(description(def(c)))+'</p>';if(S.phase==='action'&&c.owner===S.p)h+='<p class="muted">Make your main action first; this card can activate afterward if its symbol matches.</p>';else if(!eligible(c))h+='<p class="muted">'+(position(c)?'On timer · time '+position(c):c.used?'Already used this turn.':'Not available now.')+'</p>';h+='</div>'}}return h}
function use(uid,mode){run(()=>activate(find(uid),mode))}
function detail(id){$('#modalBody').innerHTML='<h2>'+esc(CARDS[id].name)+' · '+CARDS[id].color+'</h2><p>'+esc(description(CARDS[id]))+'</p><p class="muted">Workbook text: '+esc(CARDS[id].ability||'No additional ability.')+'</p><button onclick="catalog(true)">Back to cards</button>'}
function catalog(already=false){let html='<h2>All 66 cards</h2><p>Version 1.0 · active color sheets. Green and White Regeneration are separate cards. “Later ideas” are not in the deck.</p><div class="catalog">'+CARDS.map(d=>cardHTML(d.id,'catalog')).join('')+'</div>';if(already)$('#modalBody').innerHTML=html;else modal(html)}
function graveyard(){modal('<h2>Graveyards & discard</h2>'+[0,1].map(p=>'<h3>'+NAMES[p]+'</h3><p>'+esc(S.grave[p].map(c=>def(c).name).join(', ')||'Empty')+'</p>').join('')+'<h3>Shared discard</h3><p>'+esc(S.discard.map(id=>CARDS[id].name).join(', ')||'Empty')+'</p><h3>Removed from the game</h3><p>'+esc(S.removed.map(id=>CARDS[id].name).join(', ')||'None')+'</p>')}
function showRules(){modal('<h2>How to play · 1.0</h2><p>Jade starts with 3 cards; Amber starts with 4. Both castles have 10 life. All draws come from the facedown deck. There is no shared display. There is no initial play-and-discard setup.</p><ol><li><b>Start your turn.</b> Resolve the star-track bonus, if any, then slide your timer once. The outside tile enters at time 5; the tile at time 1 exits and becomes the active symbol. Its cards enter play. Spells resolve immediately.</li><li><b>Choose one main action.</b> Advance one card by 2 spaces or two cards by 1 space each; draw 2 cards from the deck and discard 1 card from your hand; or play 1 card from your hand onto the timer at its cost. Monolith removes the discard requirement.</li><li><b>Activate.</b> Each card matching your outside symbol may activate once. Creatures attack or use their ability. There are no zones and no creature movement. Click an active creature, then click an enemy card or castle. To discard, click the card in your hand. Protections apply; attacks have no counterattack.</li><li><b>Win.</b> Destroy the enemy castle, or pull the star marker to your end of the track.</li></ol><h3>Stars and bonuses</h3><p>The marker starts at 0. Printed stars are gained whenever a card enters play. Stars earned through abilities move the same marker. Jade moves it left, Amber right. Reaching 5 on your side wins immediately. Losing a card does not move the marker back.</p><p>Bonuses match the workbook exactly: Jade gains a damage bonus at −1 and a draw bonus at −3; Amber gains a damage bonus at +2 and a draw bonus at +4. They apply only when the marker is on that exact space at the start of that player’s turn. Bonus and ability draws come from the facedown deck.</p><h3>Timer capacity</h3><p>Each tile holds at most 2 cards. A card placed at a full position goes to the first free higher-numbered tile, up to 5. If none is free, you cannot play it. An advance blocked by capacity may be shortened or leave the card in place. For two-card advances, the card nearest the exit moves first.</p><h3>Card rulings for this playtest</h3><p>The 66 cards come from the color sheets; the old Foglio1 and Later ideas are excluded. Printed stars are gained again on re-entry, including Phenix and Oracle. Protection Wall protects the castle and other buildings, but not itself. Destruction is not damage. Tapped cards do not provide passive effects; their next activation only untaps them. A tapped permanent building may untap in its owner’s activation phase.</p><p>Giant and Elf archer deal their full attack to up to two different targets. Wise boar means 2 damage among friendly creatures. Wise peacekeeper awards its star at turn end only if no friendly creature attacked. Clone copies an enemy Medium creature’s activation as your own. To prevent infinite free-activation loops, nested free activations cannot use Apprentice, Angel or Clone abilities. You control target choices in this shared-screen prototype.</p><p>Spells and destroyed cards go to the owner’s graveyard. Cards discarded from hands go to the shared discard, reshuffled when the deck runs out. Old-version saves are kept separately; 1.0 starts a new game. Undo restores an entire action, including its choices.</p>')}
render();save();

</script></body></html>
